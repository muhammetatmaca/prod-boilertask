name: NestJS Auth Boilerplate CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: nest-db-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v3

      - name: Use Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/nest-db-test?schema=public

      - name: Run Lint
        run: npm run lint

      - name: Run Build
        run: npm run build

      - name: Run unit tests
        run: npm test

      - name: Run migrations for e2e
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/nest-db-test?schema=public

      - name: Run e2e tests
        run: npm run test:e2e
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/nest-db-test?schema=public
          JWT_ACCESS_SECRET: CI_TEST_SECRET
          JWT_REFRESH_SECRET: CI_REFRESH_SECRET
