version: '3.8'
services:
  postgres:
    image: postgres:15
    container_name: nestjs-postgres-dev
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: nest-db-dev
    ports:
      - '5433:5432'
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d nest-db-dev"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - dev-network

  app:
    build: 
      context: .
      dockerfile: Dockerfile
    container_name: nestjs-app-dev
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      DATABASE_URL: postgresql://user:password@postgres:5432/nest-db-dev?schema=public
      JWT_ACCESS_SECRET: yerel-gelistirme-gizli-anahtari
      JWT_REFRESH_SECRET: yerel-gelistirme-yenileme-anahtari
      NODE_ENV: development
    ports:
      - '3001:3000'
    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate dev && npm run start:dev"
    networks:
      - dev-network

volumes:
  postgres_dev_data:

networks:
  dev-network:
    driver: bridge
