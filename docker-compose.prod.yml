version: '3.8'

services:
  # ─── PostgreSQL ───
  postgres:
    image: postgres:15
    container_name: boilertask-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-boilertask}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-boilertask}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-boilertask} -d ${POSTGRES_DB:-boilertask}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ─── NestJS Backend API ───
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: boilertask-backend
    restart: always
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-boilertask}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-boilertask}?schema=public
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_ACCESS_EXPIRATION: ${JWT_ACCESS_EXPIRATION:-15m}
      JWT_REFRESH_EXPIRATION: ${JWT_REFRESH_EXPIRATION:-7d}
      MAX_LOGIN_ATTEMPTS: ${MAX_LOGIN_ATTEMPTS:-5}
      LOCKOUT_DURATION_MINUTES: ${LOCKOUT_DURATION_MINUTES:-15}
      NODE_ENV: production

    depends_on:
      postgres:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npm run start:prod"
    networks:
      - app-network



  # ─── React UI (Static via Nginx) ───
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: boilertask-ui
    restart: always
    networks:
      - app-network

  # ─── Nginx Reverse Proxy ───
  nginx:
    image: nginx:alpine
    container_name: boilertask-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - certbot_data:/var/www/certbot:ro
      - certbot_certs:/etc/letsencrypt:ro
    depends_on:
      - backend
      - ui
    networks:
      - app-network

  # ─── Certbot (SSL) ───
  certbot:
    image: certbot/certbot
    container_name: boilertask-certbot
    volumes:
      - certbot_data:/var/www/certbot
      - certbot_certs:/etc/letsencrypt
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

volumes:
  postgres_data:
  certbot_data:
  certbot_certs:

networks:
  app-network:
    driver: bridge
